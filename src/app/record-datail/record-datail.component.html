<div *ngIf="record">
  <h2>
    {{ record.title }} <span class="text-small">(id: {{ record.id }})</span>
  </h2>
  <form *ngIf="record.title">
    <mat-form-field class="example-full-width">
      <input
        matInput
        placeholder="タイトル"
        [value]="record.title"
        #titleInput
      />
    </mat-form-field>
  </form>

  <button (click)="save(titleInput.nativeElement.value)">保存</button>
</div>
